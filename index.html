
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">

  <title>JARVIS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div class="brand">
        <span class="status-dot"></span>
        J.A.R.V.I.S
      </div>
      <div class="status" id="status">EN VEILLE</div>
    </header>

    <section class="visualizer">
  <div class="hologram-container">
    <canvas id="hologram"></canvas>
  </div>

  <div class="assistant-name">J.A.R.V.I.S</div>

  <div class="assistant-message" id="assistantMessage">
    À votre service, Monsieur.
  </div>
</section>

    <section class="modes">
      <button type="button" data-mode="normal">NORMAL</button>
      <button type="button" data-mode="focus">CONCENTRATION</button>
      <button type="button" data-mode="gaming">GAMING</button>
    </section>

    <section class="conversation" id="conversation">
      <div class="welcome">
        SYSTÈME INITIALISÉ<br>
        EN ATTENTE DE VOTRE INSTRUCTION
      </div>
    </section>

    <form class="composer" id="composer">
      <button type="button" id="mic" class="icon-button"
        aria-label="Parler">🎙</button>

      <input
        id="prompt"
        type="text"
        placeholder="Parlez à JARVIS..."
        autocomplete="off"
      >

      <button type="submit" class="send-button"
        aria-label="Envoyer">➤</button>
    </form>

    <footer class="footer">
      <span>JARVIS SYSTEM 1.0</span>
      <span id="memoryStatus">MÉMOIRE LOCALE</span>
    </footer>

  </main>

  <script src="app.js" defer></script>
</body>
</html>
